name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Dry run on sample data (no keys, template fallback)
        run: python -m src.main --file data/recipients.example.xlsx --limit 2
      - name: Dry run with the example Northwind Ads config
        run: python -m src.main --config examples/northwind-ads.yaml --file data/recipients.example.xlsx --limit 2
